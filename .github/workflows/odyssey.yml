name: Odyssey IMAX watch

on:
  schedule:
    - cron: '*/5 * * * *'    # target :00,:05,:10... (rounded); NOTE GitHub cron is best-effort and often lags/coalesces to far less frequent
  workflow_dispatch:          # allow manual runs from the Actions tab
    inputs:
      threshold:
        description: 'Threshold date (override for testing; a past date forces a test alert)'
        required: false
        default: '2026-08-19'

# Avoid piling up runs if one is slow
concurrency:
  group: odyssey-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check Odyssey IMAX showtimes
        run: sleep 5 && node check.mjs   # small grace after the rounded minute, per request
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          THRESHOLD: ${{ github.event.inputs.threshold || '2026-08-19' }}
